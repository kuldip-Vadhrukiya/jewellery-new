<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Your Cart | Zariné</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- <link rel="stylesheet" href="style1.css"> -->
    <style>
      body{
        background-color: #111;
        color: #fff;
        font-family: 'Poppins', sans-serif;
      }
      .navbar {
      background: #111;
      padding: 2rem 3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 1000;
      justify-content: center;
      box-shadow: 0 6px 10px rgba(238, 255, 0, 0.08);
    }

    .navbar .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: #ffd700;
      /* margin-left: 200px; */
    }

    #menu {
      display: flex;
      list-style: none;
      gap: 30px;
    }

    #menu li {
      position: relative;
    }

    #menu li a {
      text-decoration: none;
      color: #fff;
      font-weight: bold;
      transition: color 0.3s;
    }

    #menu li a:hover {
      color: #f5c518;
    }

    .dropdown-menu {
      display: block;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
      transition: all 0.3s ease;
      position: absolute;
      top: 100%;
      left: 0;
      background: #1a1a1a;
      min-width: 160px;
      border-radius: 5px;
      padding: 10px 0;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      z-index: 999;
      list-style: none;
      pointer-events: none;
    }

    .dropdown.open .dropdown-menu {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      pointer-events: auto;
    }

    .dropdown-menu li {
      padding: 0 20px;
    }

    .dropdown-menu li a {
      color: #f5c518;
      display: block;
      padding: 10px 0;
      text-decoration: none;
    }

    .dropdown-menu li a:hover {
      color: #fff;
    }

    .dropdown.open .dropdown-menu {
      display: block;
    }
    .cart-container {
      max-width: 1100px;
      margin: 80px auto;
      padding: 0 20px;
    }
    .cart-title {
      text-align: center;
      margin-bottom: 40px;
    }
    .cart-item {
      display: flex;
      gap: 20px;
      align-items: center;
      background: #1a1a1a;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    .cart-item img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 10px;
    }
    .cart-item-info {
      flex: 1;
    }
    .cart-item-info h4 {
      margin: 0 0 5px;
    }
    .cart-item-info p {
      margin: 5px 0;
      color: #f5c518;
    }
    .cart-item input {
      width: 60px;
      padding: 8px;
      border-radius: 5px;
      border: 1px solid #333;
      background: #222;
      color: #fff;
    }
    .remove-btn {
      background: transparent;
      border: 1px solid #f5c518;
      color: #f5c518;
      padding: 8px 12px;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
    }
    .remove-btn:hover {
      background: #f5c518;
      color: #111;
    }
    .cart-summary {
      margin-top: 40px;
      background: #1a1a1a;
      padding: 30px;
      border-radius: 10px;
      text-align: right;
    }
    .cart-summary h3 {
      color: #f5c518;
      margin-bottom: 20px;
    }
    .cart-summary p {
      margin: 8px 0;
      color: #ccc;
    }
    .checkout-btn {
      margin-top: 20px;
      background: #f5c518;
      color: #111;
      padding: 12px 25px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.3s;
    }
    .checkout-btn:hover {
      background: #fff;
    }
    </style>
</head>

<body>
    <nav class="navbar">
    <div class="logo" style="margin-right: 650px;">
      <a href="index1.html" style="color:#f5c518; text-decoration: none;">Zariné</a>
    </div>

    <ul id="menu">
      <li><a href="index1.html">Home</a></li>
      <li class="dropdown">
        <a href="javascript:void(0)" onclick="toggleCategory(event)">Category</a>
        <ul class="dropdown-menu">
          <li><a href="earring.html">Earring</a></li>
          <li><a href="pendant.html">Pendant</a></li>
          <li><a href="rings.html">Rings</a></li>
          <li><a href="chain.html">Chain</a></li>
          <li><a href="bangles.html">Bangles</a></li>
        </ul>
      </li>
      <li><a href="about.html" target="_blank">About Us </a></li>
      <li><a href="contact.html" target="_blank">Contact  </a></li>
    </ul>
    </div>
  </nav>
  <div class="cart-container">
    <div class="cart-title">
      <h2>Your Shopping Cart</h2>
    </div>

    <!-- Cart Item -->
    <div class="cart-item">
      <img src="ring.jpg" alt="Product">
      <div class="cart-item-info">
        <h4>Gold Wedding Ring</h4>
        <p>₹19,999</p>
        <input type="number" value="1" min="1">
      </div>
      <button class="remove-btn">Remove</button>
    </div>

    <div class="cart-item">
      <img src="Bridal Necklace.png" alt="Product">
      <div class="cart-item-info">
        <h4>Diamond Pendant</h4>
        <p>₹35,499</p>
        <input type="number" value="1" min="1">
      </div>
      <button class="remove-btn">Remove</button>
    </div>

    <!-- Summary -->
    <div class="cart-summary">
      <h3>Order Summary</h3>
      <p>Subtotal: ₹55,498</p>
      <p>Shipping: Free</p>
      <p>Total: <strong>₹55,498</strong></p>
      <a href="checkout.html"><button class="checkout-btn">Proceed to Checkout</button></a>
    </div>
  </div>
    <script>
    function toggleCategory(event) {
      event.preventDefault();
      event.stopPropagation();
      const dropdown = event.target.closest('.dropdown');
      document.querySelectorAll('.dropdown').forEach(d => {
        if (d !== dropdown) d.classList.remove('open');
      });
      dropdown.classList.toggle('open');
    }

    window.addEventListener('click', () => {
      document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('open'));
    });
  </script>
</body>

</html>
